name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the form vX.Y.Z; got ${tag}" >&2
            exit 1
          fi

          meta_version=$(sed -n 's/^[[:space:]]*version = "\([^"]*\)",/\1/p' _meta.lua)
          if [[ -z "${meta_version}" ]]; then
            echo "Could not read version from _meta.lua" >&2
            exit 1
          fi
          if [[ "${tag}" != "v${meta_version}" ]]; then
            echo "Tag ${tag} does not match _meta.lua version ${meta_version}" >&2
            exit 1
          fi

      - name: Build installable archive
        shell: bash
        run: |
          set -euo pipefail

          git archive \
            --format=zip \
            --prefix=paragraph-spacing.koplugin/ \
            --output=paragraph-spacing.koplugin.zip \
            "${GITHUB_SHA}" \
            _meta.lua \
            main.lua \
            README.md \
            COMPATIBILITY.md \
            LICENSE
          sha256sum paragraph-spacing.koplugin.zip > paragraph-spacing.koplugin.zip.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
          gh release edit "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" \
            paragraph-spacing.koplugin.zip#"KOReader plugin" \
            paragraph-spacing.koplugin.zip.sha256#"SHA-256 checksum" \
            --clobber
